name: snowsure-test
services:
  homeassistant:
    container_name: ha-snowsure-test
    image: homeassistant/home-assistant:stable
    volumes:
      - ./test_config:/config
      # The integration serves its own card from this folder, so mounting it
      # brings the built frontend along: no /local resource to register.
      - ./custom_components/snowsure:/config/custom_components/snowsure
      - /etc/localtime:/etc/localtime:ro
    ports:
      - '8138:8123'
    restart: unless-stopped
