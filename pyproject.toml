[project]
name = "snowsure"
version = "1.0.1"
description = "Home Assistant custom integration and Lovelace card for SnowSure ski resort data"
requires-python = ">=3.14.2"
dependencies = [
    "homeassistant",
    "aiohttp",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-homeassistant-custom-component",
    "pytest-asyncio",
    "pytest-socket",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "BLE"]
