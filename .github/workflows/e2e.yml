name: E2E

on:
  push:
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build the card
        run: npm run build

      # The suite onboards this instance and adds the demo resort itself
      # (SNOWSURE_DEMO=1 in docker-compose.yml): no API key, no secrets.
      - name: Start Home Assistant
        run: docker compose up -d

      - name: Wait for Home Assistant
        run: |
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null http://127.0.0.1:8138/manifest.json; then
              echo "Home Assistant answered after about $((i * 2)) s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Home Assistant did not answer on port 8138 within 180 s"
          docker compose logs --tail 100
          exit 1

      - name: Run the e2e suite
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Show the Home Assistant log
        if: failure()
        run: docker compose logs --tail 200

      - name: Stop Home Assistant
        if: always()
        run: docker compose down
